AboutApp = [Compatibilità] \r\n 1 = Compatibile con Win10, 8.1, 8, 7, Vista \r\n 2 = Compatibile con sistemi a 64 e 32 bit\r\n 3 = Compatibile con DPI elevati, ottimale al 150%\r\n\r\n[Open source]\r\n 1 = Linguaggi: C#, Winform, licenza MIT\r\n 2 = Repository GitHub: https://github.com/BluePointLilac/ContextMenuManager \r\n 3 = Repository Gitee: https://gitee.com/BluePointLilac/ContextMenuManager \r\n\r\n[Note]\r\n 1 = Il programma legge e scrive molti file di sistema e voci di registro,\r\n potrebbe essere segnalato da Windows Defender perché queste operazioni sono molto sensibili: aggiungilo manualmente all'elenco delle esclusioni\r\n\r\n 2 = Alcune voci di menu speciali possono dipendere da altri fattori e non comparire nel menu contestuale. \r\n Tuttavia possono comunque risultare abilitate in questo programma secondo le regole generali che usa. È normale. \r\n\r\n 3 = Il metodo per disabilitare le voci varia tra i programmi di gestione del menu contestuale. Non usarne più di uno contemporaneamente. \r\n La maggior parte usa un metodo backup-elimina fragile. Questo programma usa il più possibile i valori forniti dal sistema per nascondere le chiavi. \r\n Se hai già disabilitato una voce con un altro programma, ripristinala con quello, altrimenti potresti non vederla qui. \r\n\r\n 4 = Il programma non è pensato per ripulire i residui di programmi disinstallati, ma aiuta a individuare la posizione nel registro e su disco di quelle voci.\r\n Se sei alle prime armi (o non sei sicuro di qualche opzione), limitati a usare l'interruttore abilita/disabilita (riduce il rischio di danneggiare il sistema).

Dictionaries = [Descrizione dei dizionari] \r\n Il programma ha diversi file dizionario, ognuno con una versione utente e una online. \r\n Per aggiungere un dizionario, fai clic destro per salvare il file e segui le istruzioni al suo interno. \r\n Invia il tuo dizionario all'autore via email o su GitHub per contribuire al progetto. \r\n La scheda a destra mostra il contenuto originale del dizionario, puoi cambiare scheda per vederlo \r\n\r\n[Contenuto dei dizionari]\n 1 = Dizionario dei testi dell'interfaccia (cartella Languages) \r\n 2 = Dizionario icone/testo GUID delle voci ShellEx (GuidInfosDic.ini) \r\n 3 = Dizionario impostazioni interne dei menu di programmi di terze parti (DetailedEditDic.xml) \r\n 4 = Dizionario delle voci di menu aggiuntive (EnhanceMenusDic.xml)

Donate = Questo programma è completamente gratuito. Se lo trovi utile,\r\n puoi offrire un contributo scansionando il QR code qui sotto (WeChat, Alipay, Tencent QQ).\r\n L'importo è a tua discrezione. Grazie del sostegno! Se puoi, metti una stella \r\n al progetto su GitHub o Gitee (per me significa molto!).
